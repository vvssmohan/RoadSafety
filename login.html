<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Road Safety Awareness Platform</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚦 Road Safety Awareness Platform</h1>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="learn.html">Learn</a>
      <a href="quiz.html">Quiz</a>
      <a href="report.html">Report</a>
    </div>
  </header>

  <main>
    <section class="section" style="max-width:520px; margin:0 auto;">
      <h2>Login</h2>
      <p>Use dummy credentials. Example: student / password123</p>
      <div id="login-error" class="alert" style="display:none;"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
      <p style="margin-top:12px; color:#666;">Demo users: student/password123 or admin/admin123</p>
    </section>
  </main>

  <footer>
    <p>Road Safety Awareness Platform © 2026</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
