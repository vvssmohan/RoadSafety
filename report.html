<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Issue - Road Safety Awareness Platform</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-auth="true">
  <header>
    <h1>🚦 Road Safety Awareness Platform</h1>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="learn.html">Learn</a>
      <a href="quiz.html">Quiz</a>
      <a href="report.html">Report</a>
      <button data-logout>Logout</button>
    </div>
  </header>

  <main>
    <section class="section" style="max-width:720px; margin:0 auto;">
      <h2>Report Road Safety Issue</h2>
      <p>Submit unsafe conditions. Data is stored locally in your browser.</p>
      <form id="report-form">
        <div class="form-group">
          <label for="issue_type">Issue Type</label>
          <select id="issue_type" required>
            <option value="">-- Select Issue Type --</option>
            <option value="Pothole">Pothole</option>
            <option value="Broken Traffic Light">Broken Traffic Light</option>
            <option value="Missing Road Sign">Missing Road Sign</option>
            <option value="Poor Lighting">Poor Lighting</option>
            <option value="Damaged Guardrail">Damaged Guardrail</option>
            <option value="Unmarked Speed Breaker">Unmarked Speed Breaker</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" placeholder="e.g., Main Street near City Mall" required />
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="4" placeholder="Describe the issue..." required></textarea>
        </div>
        <button type="submit" class="btn">Submit Report</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Road Safety Awareness Platform © 2026</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
